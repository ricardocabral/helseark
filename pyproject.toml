[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helseark"
version = "0.1.0"
description = "Offline immutable personal health archive"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
helseark = "helseark.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
# Preserve the lock's seven-day release cutoff without relying on user config.
exclude-newer = "7 days"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/helseark/schemas/0.1.0" = ["schemas/0.1.0/*.json"]
"share/helseark/definitions" = ["definitions/lock.json", "definitions/upstream-inventory.json"]
"share/helseark/definitions/fhir-r4-json-schema" = ["definitions/fhir-r4-json-schema/*.json"]
"share/helseark/definitions/runtime-core/4.0.1" = ["definitions/runtime-core/4.0.1/hl7.fhir.r4.core.tgz"]
"share/helseark/definitions/hl7.fhir.r4.core/4.0.1/package" = ["definitions/hl7.fhir.r4.core/4.0.1/package/*.json"]
"share/helseark/definitions/docs/r4" = ["definitions/docs/r4/*.html"]
"share/helseark/profiles/r4/0.1.0" = ["profiles/r4/0.1.0/*.json", "profiles/r4/0.1.0/README.md"]
"share/helseark/docs/reference" = ["docs/reference/clinical-model.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
