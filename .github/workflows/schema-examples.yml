name: Schemas and examples

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "instructions.md"
      - "skills/helseark/**"
      - "vocabulary/**"
      - "prompts/**"
      - "examples/**"
      - "docs/tutorial.md"
      - "docs/how-to.md"
      - "docs/schemas.md"
      - "docs/terminology.md"
      - "docs/development/coding-guide.md"
      - "docs/explanation/evidence-and-review.md"
      - "tests/test_examples.py"
      - "tests/test_terminology*.py"
      - "AGENTS.md"
      - "SCOPE.md"
      - "CONTRIBUTING.md"
      - "definitions/fhir-r4-json-schema/**"
      - "schemas/0.1.0/evidence.schema.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/schema-examples.yml"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Validate schemas and examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false

      - name: Install only locked schema-validation dependencies
        run: uv sync --locked --no-install-project --no-default-groups

      # Execute the optional check contributors can copy from the schema reference.
      # This proves structure and decimal scale, not clinical truth or approval.
      - name: Run documented structural validation
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          page = Path('docs/schemas.md').read_text()
          command = page.split("python3 - <<'PY'\n", 1)[1].split("\nPY\n", 1)[0]
          subprocess.run([sys.executable, '-c', command], check=True)
          PY

      - name: Check invented source, FHIR and citation consistency
        run: uv run --no-sync python -m unittest discover -s tests -p test_examples.py -v

      - name: Check offline terminology helper and invented mapping examples
        run: uv run --no-sync python -m unittest discover -s tests -p 'test_terminology*.py' -v
