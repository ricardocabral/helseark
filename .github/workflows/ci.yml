name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python 3.12 / ${{ matrix.os }} / ${{ matrix.test-group }}
    runs-on: ${{ matrix.os }}
    # Partition the full suite so archive I/O stays within a bounded job window.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test-group: [agent, clinical, portability, core]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies including tests
        run: uv sync --locked --extra pdf --group dev

      - name: Assert exact qualified PDF dependency (absence must fail)
        run: |
          uv run --no-sync python -c "import importlib.metadata, pypdf; assert importlib.metadata.version('pypdf') == pypdf.__version__ == '7.0.0'"

      - name: Run agent context and workflow tests
        if: matrix.test-group == 'agent'
        run: uv run --no-sync pytest tests/test_agent_context.py tests/test_agent_workflows.py

      # Review, validation and query account for most of the Linux core job's
      # runtime. Keep them separate while the remaining group discovers new tests.
      - name: Run clinical review, validation and query tests
        if: matrix.test-group == 'clinical'
        run: uv run --no-sync pytest tests/test_review.py tests/test_validation.py tests/test_query.py

      - name: Run portability and source disclosure tests
        if: matrix.test-group == 'portability'
        run: uv run --no-sync pytest tests/test_portability.py tests/test_portability_enumeration.py tests/test_source_disclosure.py

      - name: Run all remaining tests
        if: matrix.test-group == 'core'
        run: uv run --no-sync pytest --ignore=tests/test_agent_context.py --ignore=tests/test_agent_workflows.py --ignore=tests/test_review.py --ignore=tests/test_validation.py --ignore=tests/test_query.py --ignore=tests/test_portability.py --ignore=tests/test_portability_enumeration.py --ignore=tests/test_source_disclosure.py

      - name: Build source distribution and wheel
        if: matrix.test-group == 'core'
        run: uv build --no-sources

      - name: Verify built distribution licensing
        if: matrix.test-group == 'core'
        run: uv run --no-sync python tests/qualify_distribution.py dist
      - name: Verify source and distribution closure
        if: matrix.test-group == 'core'
        run: uv run --no-sync python tests/qualify_documentation_distribution.py . dist

      - name: Execute installed offline documentation and restored onboarding
        if: matrix.test-group == 'core'
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/documentation-env"
          wheels=(dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/documentation-env/bin/python" "${wheels[0]}[pdf]"
          cp tests/qualify_documentation_installed.py "$RUNNER_TEMP/qualify-documentation.py"
          "$RUNNER_TEMP/documentation-env/bin/python" "$RUNNER_TEMP/qualify-documentation.py" "$RUNNER_TEMP/documentation-journey" "$GITHUB_WORKSPACE"

  base-optionality:
    name: Base-only PDF optionality / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false

      - name: Install base only in this fresh job environment
        run: uv sync --locked --no-default-groups

      - name: Verify absent dependency and base-only behavior
        run: uv run --no-sync python tests/check_pdf_optionality.py

  fixture-provenance:
    name: Synthetic fixture provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify declared provenance and byte inventory
        run: python3 scripts/check_fixture_manifest.py

  official-validator:
    name: Real pinned offline R4 validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked Python environment
        run: uv sync --locked --extra pdf --group dev
      - name: Explicit public artifact acquisition (before offline execution)
        run: |
          uv run --no-sync python scripts/acquire_validator.py "$RUNNER_TEMP/validator" --linux-jre
          test -x "$RUNNER_TEMP/validator/runtime/jdk-17.0.21+9-jre/bin/java"
      - name: Build and install exact qualification runtime once
        run: |
          uv build --no-sources
          uv venv --python "$PWD/.venv/bin/python" "$RUNNER_TEMP/authority-env"
          uv pip install --offline --no-deps --python "$RUNNER_TEMP/authority-env/bin/python" dist/*.whl
          # Only this job's locked dependencies; adding the path does not process
          # the editable project's nested .pth. Both producers verify wheel bytes.
          "$RUNNER_TEMP/authority-env/bin/python" -c 'import pathlib,sys,sysconfig; pathlib.Path(sysconfig.get_path("purelib"), "qualified-dependencies.pth").write_text(sys.argv[1]+"\n")' "$PWD/.venv/lib/python3.12/site-packages"
          uv run --no-sync python tests/setup_validator_legacy.py "$RUNNER_TEMP/legacy-workflow"
      - name: Real installed corpus with enforced empty network namespace
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/official-evidence"
          sudo env PYTHONPATH="$PWD/tests" \
            "$RUNNER_TEMP/authority-env/bin/python" tests/qualify_official_validator.py \
            --wheel dist/*.whl --fixtures "$PWD/tests/fixtures/synthetic" \
            --artifacts "$RUNNER_TEMP/validator" --java "$RUNNER_TEMP/validator/runtime/jdk-17.0.21+9-jre/bin/java" \
            --output "$RUNNER_TEMP/official-evidence/run" --timeout-seconds 240 \
            2>&1 | tee "$RUNNER_TEMP/official-evidence/producer.txt"
      - name: Actual installed execution authority and failed-request matrix
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/authority-staging" "$RUNNER_TEMP/authority-evidence"
          sudo env PYTHONPATH="$PWD/tests" TMPDIR="$RUNNER_TEMP/authority-staging" \
            "$RUNNER_TEMP/authority-env/bin/python" tests/qualify_validator_authority.py --wheel dist/*.whl \
            --artifacts "$RUNNER_TEMP/validator" --java "$RUNNER_TEMP/validator/runtime/jdk-17.0.21+9-jre/bin/java" \
            --output "$RUNNER_TEMP/authority-evidence/run" --timeout-seconds 240 \
            --legacy-workflow "$RUNNER_TEMP/legacy-workflow" \
            2>&1 | tee "$RUNNER_TEMP/authority-evidence/producer.txt"
      - name: Retain synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-validator-evidence
          path: |
            dist/*.whl
            ${{ runner.temp }}/validator/acquisition.jsonl
            ${{ runner.temp }}/official-evidence/run/*.json
            ${{ runner.temp }}/official-evidence/*.txt
            ${{ runner.temp }}/authority-evidence/run/*.json
            ${{ runner.temp }}/authority-evidence/*.txt
          if-no-files-found: error
