name: CI

on:
  # Branch pushes are covered by pull_request; main is checked after integration.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "profiles/**"
      - "definitions/**"
      - "agent-kit/**"
      # These documents are pinned runtime inputs in definitions/lock.json.
      - "docs/how-to/backup-and-restore.md"
      - "docs/how-to/export-records.md"
      - "docs/how-to/import-report.md"
      - "docs/how-to/query-history.md"
      - "docs/reference/agent-protocol.md"
      - "docs/reference/archive-format.md"
      - "docs/reference/clinical-model.md"
      - "docs/reference/intake.md"
      - "docs/reference/pdf-extraction.md"
      - "docs/reference/review.md"
      - "docs/tutorials/first-archive.md"
      - "pyproject.toml"
      - "uv.lock"
      - "MANIFEST.in"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "profiles/**"
      - "definitions/**"
      - "agent-kit/**"
      # These documents are pinned runtime inputs in definitions/lock.json.
      - "docs/how-to/backup-and-restore.md"
      - "docs/how-to/export-records.md"
      - "docs/how-to/import-report.md"
      - "docs/how-to/query-history.md"
      - "docs/reference/agent-protocol.md"
      - "docs/reference/archive-format.md"
      - "docs/reference/clinical-model.md"
      - "docs/reference/intake.md"
      - "docs/reference/pdf-extraction.md"
      - "docs/reference/review.md"
      - "docs/tutorials/first-archive.md"
      - "pyproject.toml"
      - "uv.lock"
      - "MANIFEST.in"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Python 3.12 / ubuntu-latest / ${{ matrix.test-group }}
    runs-on: ubuntu-latest
    # The optional application keeps its full suite on one platform/version.
    # Partition archive I/O into three bounded jobs; macOS qualification is deferred.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test-group: [agent, clinical, core]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies including tests
        run: uv sync --locked --extra pdf --group dev

      - name: Assert exact qualified PDF dependency (absence must fail)
        run: |
          uv run --no-sync python -c "import importlib.metadata, pypdf; assert importlib.metadata.version('pypdf') == pypdf.__version__ == '7.0.0'"

      - name: Run agent context and workflow tests
        if: matrix.test-group == 'agent'
        run: uv run --no-sync pytest tests/test_agent_context.py tests/test_agent_workflows.py

      # Review, validation and query account for most of the Linux core job's
      # runtime. Keep them separate while the remaining group discovers new tests.
      - name: Run clinical review, validation and query tests
        if: matrix.test-group == 'clinical'
        run: uv run --no-sync pytest tests/test_review.py tests/test_validation.py tests/test_query.py

      - name: Run all remaining tests
        if: matrix.test-group == 'core'
        run: uv run --no-sync pytest --ignore=tests/test_agent_context.py --ignore=tests/test_agent_workflows.py --ignore=tests/test_review.py --ignore=tests/test_validation.py --ignore=tests/test_query.py

      - name: Build source distribution and wheel
        if: matrix.test-group == 'core'
        run: uv build --no-sources

      - name: Verify built distribution licensing
        if: matrix.test-group == 'core'
        run: uv run --no-sync python tests/qualify_distribution.py dist

  base-optionality:
    name: Base-only PDF optionality / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false

      - name: Install base only in this fresh job environment
        run: uv sync --locked --no-default-groups

      - name: Verify absent dependency and base-only behavior
        run: uv run --no-sync python tests/check_pdf_optionality.py
